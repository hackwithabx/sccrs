<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bgPaths" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="pathShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="900" height="540" rx="14" fill="url(#bgPaths)"/>
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Software Supply Chain Attack Paths</text>

  <rect x="20" y="72" width="250" height="186" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#pathShadow)"/>
  <text x="145" y="98" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">Attacker Entry Points</text>
  <rect x="38" y="116" width="214" height="30" rx="6" fill="#3f0d12" stroke="#ef4444"/>
  <text x="145" y="136" text-anchor="middle" fill="#fecaca" font-size="12">Maintainer compromise</text>
  <rect x="38" y="156" width="214" height="30" rx="6" fill="#422006" stroke="#f59e0b"/>
  <text x="145" y="176" text-anchor="middle" fill="#fde68a" font-size="12">Dependency confusion</text>
  <rect x="38" y="196" width="214" height="30" rx="6" fill="#172554" stroke="#3b82f6"/>
  <text x="145" y="216" text-anchor="middle" fill="#bfdbfe" font-size="12">CI workflow poisoning</text>
  <rect x="38" y="236" width="214" height="30" rx="6" fill="#052e16" stroke="#22c55e"/>
  <text x="145" y="256" text-anchor="middle" fill="#bbf7d0" font-size="12">Update or CDN takeover</text>

  <rect x="325" y="72" width="250" height="186" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#pathShadow)"/>
  <text x="450" y="98" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">Trusted Delivery Layer</text>
  <rect x="343" y="116" width="214" height="30" rx="6" fill="#082f49" stroke="#38bdf8"/>
  <text x="450" y="136" text-anchor="middle" fill="#e0f2fe" font-size="12">Registry install or package update</text>
  <rect x="343" y="156" width="214" height="30" rx="6" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="450" y="176" text-anchor="middle" fill="#ede9fe" font-size="12">Build execution in CI</text>
  <rect x="343" y="196" width="214" height="30" rx="6" fill="#1f2937" stroke="#94a3b8"/>
  <text x="450" y="216" text-anchor="middle" fill="#e5e7eb" font-size="12">Artifact signing or publishing</text>
  <rect x="343" y="236" width="214" height="30" rx="6" fill="#3f1d0a" stroke="#f59e0b"/>
  <text x="450" y="256" text-anchor="middle" fill="#fef3c7" font-size="12">Deployment or client update</text>

  <rect x="630" y="72" width="250" height="186" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#pathShadow)"/>
  <text x="755" y="98" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="700">Downstream Effects</text>
  <rect x="648" y="116" width="214" height="30" rx="6" fill="#3f0d12" stroke="#ef4444"/>
  <text x="755" y="136" text-anchor="middle" fill="#fecaca" font-size="12">Secrets exfiltration</text>
  <rect x="648" y="156" width="214" height="30" rx="6" fill="#422006" stroke="#f59e0b"/>
  <text x="755" y="176" text-anchor="middle" fill="#fde68a" font-size="12">Backdoored artifacts</text>
  <rect x="648" y="196" width="214" height="30" rx="6" fill="#172554" stroke="#3b82f6"/>
  <text x="755" y="216" text-anchor="middle" fill="#bfdbfe" font-size="12">Cloud or workstation pivot</text>
  <rect x="648" y="236" width="214" height="30" rx="6" fill="#052e16" stroke="#22c55e"/>
  <text x="755" y="256" text-anchor="middle" fill="#bbf7d0" font-size="12">Customer-side compromise</text>

  <line x1="270" y1="166" x2="325" y2="166" stroke="#67e8f9" stroke-width="3"/>
  <line x1="575" y1="166" x2="630" y2="166" stroke="#67e8f9" stroke-width="3"/>

  <rect x="20" y="300" width="860" height="86" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#pathShadow)"/>
  <text x="450" y="328" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Why Detection Is Hard</text>
  <text x="90" y="354" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">Looks legitimate</text>
  <text x="90" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">Normal installs, updates, and builds</text>
  <text x="275" y="354" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">Hidden transitive risk</text>
  <text x="275" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">Indirect dependencies enter quietly</text>
  <text x="450" y="354" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">Broad permissions</text>
  <text x="450" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">Pipelines often hold valuable secrets</text>
  <text x="635" y="354" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700">Weak provenance</text>
  <text x="635" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">Teams cannot prove what they built</text>
  <text x="810" y="354" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">Slow blast analysis</text>
  <text x="810" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">Usage and exposure are hard to map</text>

  <rect x="20" y="410" width="420" height="94" rx="12" fill="#111827" stroke="#22c55e" stroke-width="1.5" filter="url(#pathShadow)"/>
  <text x="230" y="438" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">High-Value Precautions</text>
  <text x="40" y="462" fill="#94a3b8" font-size="11">- Pin workflow dependencies to immutable SHAs</text>
  <text x="40" y="480" fill="#94a3b8" font-size="11">- Commit lockfiles and review dependency diffs</text>
  <text x="40" y="498" fill="#94a3b8" font-size="11">- Generate SBOMs and preserve build provenance</text>

  <rect x="460" y="410" width="420" height="94" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.5" filter="url(#pathShadow)"/>
  <text x="670" y="438" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">Response Priorities</text>
  <text x="480" y="462" fill="#94a3b8" font-size="11">- Freeze the pipeline or component in question</text>
  <text x="480" y="480" fill="#94a3b8" font-size="11">- Rotate secrets and rebuild from known-good state</text>
  <text x="480" y="498" fill="#94a3b8" font-size="11">- Prove which artifacts and environments were affected</text>

  <text x="450" y="523" text-anchor="middle" fill="#64748b" font-size="10">securecodereviews.com  |  Supply chain attack explainer</text>
</svg>