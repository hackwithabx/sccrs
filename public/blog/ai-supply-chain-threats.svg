  <text x="160" y="296" text-anchor="middle" fill="#94a3b8" font-size="9">executed arbitrary code on model load</text>
  <text x="160" y="311" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">Impact: RCE on developer machines</text>

