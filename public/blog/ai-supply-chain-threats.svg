  <text x="450" y="281" text-anchor="middle" fill="#94a3b8" font-size="9">Compromised torchtriton package on PyPI</text>
  <text x="450" y="296" text-anchor="middle" fill="#94a3b8" font-size="9">exfiltrated SSH keys, AWS credentials</text>
  <text x="450" y="311" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">Impact: Credential theft at scale</text>

  <rect x="600" y="240" width="280" height="85" rx="8" fill="#1e1e2e" stroke="#dc2626" stroke-width="1" filter="url(#sh3)"/>
  <text x="740" y="263" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">LAION Dataset CSAM (2023)</text>
  <text x="740" y="281" text-anchor="middle" fill="#94a3b8" font-size="9">Stanford found illegal content in LAION-5B</text>
  <text x="740" y="296" text-anchor="middle" fill="#94a3b8" font-size="9">training dataset used by Stable Diffusion</text>
  <text x="740" y="311" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">Impact: Legal + reputational risk</text>

