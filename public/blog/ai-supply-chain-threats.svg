  <rect x="405" y="70" width="155" height="110" rx="10" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh3)"/>
  <text x="482" y="95" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">⚙️ Fine-tuning</text>
