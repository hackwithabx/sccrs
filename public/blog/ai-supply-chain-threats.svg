  <text x="105" y="115" text-anchor="middle" fill="#94a3b8" font-size="10">Hugging Face, GitHub</text>
  <text x="105" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">PyTorch Hub, TF Hub</text>
  <rect x="30" y="142" width="150" height="28" rx="5" fill="#7f1d1d" stroke="#dc2626" stroke-width="1"/>
  <text x="105" y="160" text-anchor="middle" fill="#fca5a5" font-size="9">🔥 Backdoored weights</text>

