<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bgAgentic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#fb7185"/>
    </linearGradient>
    <filter id="shadowAgentic">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowAgentic" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="16" fill="url(#bgAgentic)"/>

  <text x="600" y="58" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="700">What Is Agentic AI?</text>
  <text x="600" y="92" text-anchor="middle" fill="#cbd5e1" font-size="18">Use Cases, Security Risks, Challenges, and Future</text>

  <rect x="60" y="140" width="250" height="360" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#shadowAgentic)"/>
  <text x="185" y="180" text-anchor="middle" fill="#67e8f9" font-size="22" font-weight="700">How It Works</text>
  <rect x="88" y="208" width="194" height="58" rx="10" fill="#082f49" stroke="#38bdf8"/>
  <text x="185" y="232" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="600">Goal</text>
  <text x="185" y="252" text-anchor="middle" fill="#93c5fd" font-size="12">"Resolve billing issue"</text>
  <rect x="88" y="286" width="194" height="58" rx="10" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="185" y="310" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="600">Planner</text>
  <text x="185" y="330" text-anchor="middle" fill="#c4b5fd" font-size="12">Breaks work into steps</text>
  <rect x="88" y="364" width="194" height="58" rx="10" fill="#052e16" stroke="#22c55e"/>
  <text x="185" y="388" text-anchor="middle" fill="#dcfce7" font-size="14" font-weight="600">Tools + Memory</text>
  <text x="185" y="408" text-anchor="middle" fill="#86efac" font-size="12">APIs, docs, tickets, context</text>
  <rect x="88" y="442" width="194" height="58" rx="10" fill="#3f1d0a" stroke="#f59e0b"/>
  <text x="185" y="466" text-anchor="middle" fill="#fef3c7" font-size="14" font-weight="600">Actions</text>
  <text x="185" y="486" text-anchor="middle" fill="#fcd34d" font-size="12">Write, update, notify, change</text>

  <rect x="360" y="140" width="480" height="360" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadowAgentic)"/>
  <text x="600" y="180" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Why It Is Different</text>

  <rect x="400" y="220" width="140" height="74" rx="12" fill="#082f49" stroke="#38bdf8"/>
  <text x="470" y="248" text-anchor="middle" fill="#e0f2fe" font-size="15" font-weight="700">Prompt</text>
  <text x="470" y="268" text-anchor="middle" fill="#93c5fd" font-size="12">input from user</text>
  <line x1="540" y1="257" x2="590" y2="257" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowAgentic)"/>
  <rect x="600" y="220" width="140" height="74" rx="12" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="670" y="248" text-anchor="middle" fill="#ede9fe" font-size="15" font-weight="700">Agent</text>
  <text x="670" y="268" text-anchor="middle" fill="#c4b5fd" font-size="12">plans and decides</text>
  <line x1="670" y1="294" x2="670" y2="338" stroke="#8b5cf6" stroke-width="3"/>
  <line x1="540" y1="385" x2="590" y2="385" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowAgentic)"/>
  <rect x="600" y="348" width="140" height="74" rx="12" fill="#052e16" stroke="#22c55e"/>
  <text x="670" y="376" text-anchor="middle" fill="#dcfce7" font-size="15" font-weight="700">Tools</text>
  <text x="670" y="396" text-anchor="middle" fill="#86efac" font-size="12">tickets, email, APIs</text>
  <rect x="400" y="348" width="140" height="74" rx="12" fill="#3f1d0a" stroke="#f59e0b"/>
  <text x="470" y="376" text-anchor="middle" fill="#fef3c7" font-size="15" font-weight="700">Memory</text>
  <text x="470" y="396" text-anchor="middle" fill="#fcd34d" font-size="12">state and persistence</text>

  <text x="600" y="458" text-anchor="middle" fill="#cbd5e1" font-size="15">A chatbot answers. An agent plans, remembers, uses tools, and takes action.</text>

  <rect x="890" y="140" width="250" height="360" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#shadowAgentic)"/>
  <text x="1015" y="180" text-anchor="middle" fill="#fca5a5" font-size="22" font-weight="700">Security Risks</text>
  <rect x="918" y="206" width="194" height="52" rx="10" fill="#3f0d12" stroke="#ef4444"/>
  <text x="1015" y="228" text-anchor="middle" fill="#fecaca" font-size="13" font-weight="700">Prompt Injection</text>
  <text x="1015" y="246" text-anchor="middle" fill="#fda4af" font-size="11">Changes plans and behavior</text>
  <rect x="918" y="276" width="194" height="52" rx="10" fill="#422006" stroke="#f59e0b"/>
  <text x="1015" y="298" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">Over-Privileged Tools</text>
  <text x="1015" y="316" text-anchor="middle" fill="#fcd34d" font-size="11">Mistakes become real actions</text>
  <rect x="918" y="346" width="194" height="52" rx="10" fill="#172554" stroke="#3b82f6"/>
  <text x="1015" y="368" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">Data Exposure</text>
  <text x="1015" y="386" text-anchor="middle" fill="#93c5fd" font-size="11">Weak retrieval boundaries leak data</text>
  <rect x="918" y="416" width="194" height="52" rx="10" fill="#1f2937" stroke="#94a3b8"/>
  <text x="1015" y="438" text-anchor="middle" fill="#e5e7eb" font-size="13" font-weight="700">Governance Gap</text>
  <text x="1015" y="456" text-anchor="middle" fill="#cbd5e1" font-size="11">Autonomy moves faster than controls</text>

  <text x="600" y="580" text-anchor="middle" fill="#64748b" font-size="14">securecodereviews.com • Agentic AI security guide</text>
</svg>