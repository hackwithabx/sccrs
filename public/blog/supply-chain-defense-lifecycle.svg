<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bgDefense" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="defShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="14" fill="url(#bgDefense)"/>
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Supply Chain Defense Lifecycle</text>

  <rect x="20" y="76" width="860" height="86" rx="12" fill="#111827" stroke="#334155" stroke-width="1.2" filter="url(#defShadow)"/>
  <text x="120" y="107" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="700">Select</text>
  <text x="120" y="127" text-anchor="middle" fill="#94a3b8" font-size="10">Review dependencies and vendors</text>
  <text x="290" y="107" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">Build</text>
  <text x="290" y="127" text-anchor="middle" fill="#94a3b8" font-size="10">Deterministic CI and pinned workflows</text>
  <text x="450" y="107" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">Prove</text>
  <text x="450" y="127" text-anchor="middle" fill="#94a3b8" font-size="10">SBOMs, signatures, provenance</text>
  <text x="620" y="107" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">Deploy</text>
  <text x="620" y="127" text-anchor="middle" fill="#94a3b8" font-size="10">Controlled artifact release paths</text>
  <text x="785" y="107" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">Respond</text>
  <text x="785" y="127" text-anchor="middle" fill="#94a3b8" font-size="10">Scope exposure and rebuild safely</text>

  <rect x="20" y="194" width="200" height="120" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5" filter="url(#defShadow)"/>
  <text x="120" y="222" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="700">Developer Controls</text>
  <text x="36" y="248" fill="#94a3b8" font-size="10">- Commit lockfiles</text>
  <text x="36" y="266" fill="#94a3b8" font-size="10">- Review dependency diffs</text>
  <text x="36" y="284" fill="#94a3b8" font-size="10">- Challenge new packages</text>

  <rect x="240" y="194" width="200" height="120" rx="12" fill="#111827" stroke="#8b5cf6" stroke-width="1.5" filter="url(#defShadow)"/>
  <text x="340" y="222" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">Pipeline Controls</text>
  <text x="256" y="248" fill="#94a3b8" font-size="10">- Pin actions to SHAs</text>
  <text x="256" y="266" fill="#94a3b8" font-size="10">- Minimize secret scope</text>
  <text x="256" y="284" fill="#94a3b8" font-size="10">- Isolate runners</text>

  <rect x="460" y="194" width="200" height="120" rx="12" fill="#111827" stroke="#22c55e" stroke-width="1.5" filter="url(#defShadow)"/>
  <text x="560" y="222" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">Artifact Controls</text>
  <text x="476" y="248" fill="#94a3b8" font-size="10">- Generate SBOMs</text>
  <text x="476" y="266" fill="#94a3b8" font-size="10">- Preserve provenance</text>
  <text x="476" y="284" fill="#94a3b8" font-size="10">- Verify release integrity</text>

  <rect x="680" y="194" width="200" height="120" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.5" filter="url(#defShadow)"/>
  <text x="780" y="222" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">Runtime Controls</text>
  <text x="696" y="248" fill="#94a3b8" font-size="10">- Restrict update paths</text>
  <text x="696" y="266" fill="#94a3b8" font-size="10">- Monitor unusual behavior</text>
  <text x="696" y="284" fill="#94a3b8" font-size="10">- Rotate secrets after compromise</text>

  <rect x="20" y="352" width="420" height="116" rx="12" fill="#111827" stroke="#ef4444" stroke-width="1.5" filter="url(#defShadow)"/>
  <text x="230" y="382" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">Why Teams Still Struggle</text>
  <text x="40" y="410" fill="#94a3b8" font-size="11">- Too many transitive dependencies and external trust paths</text>
  <text x="40" y="430" fill="#94a3b8" font-size="11">- Vulnerability noise hides integrity-focused problems</text>
  <text x="40" y="450" fill="#94a3b8" font-size="11">- Incident scoping is slow without lineage and provenance</text>

  <rect x="460" y="352" width="420" height="116" rx="12" fill="#111827" stroke="#22c55e" stroke-width="1.5" filter="url(#defShadow)"/>
  <text x="670" y="382" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">What Good Looks Like</text>
  <text x="480" y="410" fill="#94a3b8" font-size="11">- Fewer dependencies, stronger review, clearer ownership</text>
  <text x="480" y="430" fill="#94a3b8" font-size="11">- Verifiable builds and controlled release workflows</text>
  <text x="480" y="450" fill="#94a3b8" font-size="11">- Rebuild and recovery playbooks ready before an incident</text>

  <text x="450" y="497" text-anchor="middle" fill="#64748b" font-size="10">securecodereviews.com  |  Defense lifecycle for software supply chain security</text>
</svg>