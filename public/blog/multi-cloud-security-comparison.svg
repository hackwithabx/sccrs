  <text x="175" y="450" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#ff9900" text-anchor="middle">AWS</text>
  <text x="175" y="470" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">31% market share</text>
  <text x="175" y="488" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">300+ security services</text>
  <rect x="325" y="425" width="250" height="80" rx="8" fill="#4285f410" stroke="#4285f460" stroke-width="1"/>
  <text x="450" y="450" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#4285f4" text-anchor="middle">Google Cloud</text>
  <text x="450" y="470" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">12% market share</text>
  <text x="450" y="488" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Best-in-class zero trust</text>
