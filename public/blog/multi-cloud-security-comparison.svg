  <text x="727" y="450" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Azure</text>
  <text x="727" y="470" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">24% market share</text>
  <text x="727" y="488" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Best Entra ID integration</text>
