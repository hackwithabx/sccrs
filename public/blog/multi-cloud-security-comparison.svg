  </defs>
  <rect width="900" height="520" rx="12" fill="url(#mcsBg)"/>
  <text x="450" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#06b6d4" text-anchor="middle">Multi-Cloud Security Comparison — AWS vs GCP vs Azure</text>
