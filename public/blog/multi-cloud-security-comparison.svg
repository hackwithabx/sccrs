  <text x="535" y="344" font-family="system-ui,sans-serif" font-size="10" fill="#60a5fa" text-anchor="middle">SCC Premium</text>
  <rect x="640" y="320" width="225" height="40" fill="#1e293b40"/>
  <text x="752" y="344" font-family="system-ui,sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Defender for Cloud</text>
