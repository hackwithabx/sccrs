<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="sh2"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="900" height="540" fill="url(#bg2)" rx="12"/>
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">RAG Pipeline Attack Surfaces</text>

  <!-- Stage 1: Data Ingestion -->
  <rect x="30" y="65" width="185" height="130" rx="10" fill="#1e1e2e" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="122" y="90" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">📥 Data Ingestion</text>
  <text x="122" y="112" text-anchor="middle" fill="#94a3b8" font-size="10">PDFs, Docs, Web pages</text>
  <text x="122" y="127" text-anchor="middle" fill="#94a3b8" font-size="10">APIs, Databases</text>
  <rect x="45" y="140" width="155" height="40" rx="6" fill="#7f1d1d" stroke="#dc2626" stroke-width="1"/>
  <text x="122" y="157" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">⚠️ Poisoned documents</text>
  <text x="122" y="170" text-anchor="middle" fill="#fca5a5" font-size="9">with hidden instructions</text>

  <!-- Arrow -->
  <line x1="215" y1="130" x2="245" y2="130" stroke="#3b82f6" stroke-width="2" marker-end="url(#a2b)"/>
  <defs><marker id="a2b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/></marker></defs>

  <!-- Stage 2: Embedding -->
  <rect x="250" y="65" width="165" height="130" rx="10" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="332" y="90" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">🧮 Embedding</text>
  <text x="332" y="112" text-anchor="middle" fill="#94a3b8" font-size="10">Text → Vectors</text>
  <text x="332" y="127" text-anchor="middle" fill="#94a3b8" font-size="10">Chunking + Tokenization</text>
  <rect x="260" y="140" width="145" height="40" rx="6" fill="#7f1d1d" stroke="#dc2626" stroke-width="1"/>
  <text x="332" y="157" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">⚠️ Embedding inversion</text>
  <text x="332" y="170" text-anchor="middle" fill="#fca5a5" font-size="9">extracts original text</text>

  <!-- Arrow -->
  <line x1="415" y1="130" x2="445" y2="130" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a2p)"/>
  <defs><marker id="a2p" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/></marker></defs>

  <!-- Stage 3: Vector Store -->
  <rect x="450" y="65" width="165" height="130" rx="10" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="532" y="90" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">🗄️ Vector Store</text>
  <text x="532" y="112" text-anchor="middle" fill="#94a3b8" font-size="10">Pinecone / Weaviate /</text>
  <text x="532" y="127" text-anchor="middle" fill="#94a3b8" font-size="10">Chroma / pgvector</text>
  <rect x="460" y="140" width="145" height="40" rx="6" fill="#7f1d1d" stroke="#dc2626" stroke-width="1"/>
  <text x="532" y="157" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">⚠️ Unauthorized access</text>
  <text x="532" y="170" text-anchor="middle" fill="#fca5a5" font-size="9">No tenant isolation</text>

  <!-- Arrow -->
  <line x1="615" y1="130" x2="645" y2="130" stroke="#f59e0b" stroke-width="2" marker-end="url(#a2y)"/>
  <defs><marker id="a2y" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/></marker></defs>

  <!-- Stage 4: Retrieval + LLM -->
  <rect x="650" y="65" width="220" height="130" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="760" y="90" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">🤖 Retrieval + LLM</text>
  <text x="760" y="112" text-anchor="middle" fill="#94a3b8" font-size="10">Query → Top-K chunks</text>
  <text x="760" y="127" text-anchor="middle" fill="#94a3b8" font-size="10">→ Augmented prompt → Response</text>
  <rect x="660" y="140" width="200" height="40" rx="6" fill="#7f1d1d" stroke="#dc2626" stroke-width="1"/>
  <text x="760" y="157" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">⚠️ Indirect prompt injection</text>
  <text x="760" y="170" text-anchor="middle" fill="#fca5a5" font-size="9">via retrieved context</text>

  <!-- Mitigations Section -->
  <text x="450" y="230" text-anchor="middle" fill="#22c55e" font-size="18" font-weight="700">🛡️ RAG Security Controls</text>

  <!-- Mitigation Row 1 -->
  <rect x="30" y="250" width="265" height="90" rx="8" fill="#1e1e2e" stroke="#334155" stroke-width="1" filter="url(#sh2)"/>
  <text x="162" y="275" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Input Validation Layer</text>
  <text x="162" y="293" text-anchor="middle" fill="#94a3b8" font-size="10">• Scan documents for hidden prompts before indexing</text>
  <text x="162" y="308" text-anchor="middle" fill="#94a3b8" font-size="10">• Content integrity hashing (SHA-256)</text>
  <text x="162" y="323" text-anchor="middle" fill="#94a3b8" font-size="10">• Metadata provenance tracking</text>

  <rect x="315" y="250" width="265" height="90" rx="8" fill="#1e1e2e" stroke="#334155" stroke-width="1" filter="url(#sh2)"/>
  <text x="447" y="275" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">Access Control</text>
  <text x="447" y="293" text-anchor="middle" fill="#94a3b8" font-size="10">• Per-tenant vector namespace isolation</text>
  <text x="447" y="308" text-anchor="middle" fill="#94a3b8" font-size="10">• Document-level permission filtering</text>
  <text x="447" y="323" text-anchor="middle" fill="#94a3b8" font-size="10">• Query-time authorization checks</text>

  <rect x="600" y="250" width="270" height="90" rx="8" fill="#1e1e2e" stroke="#334155" stroke-width="1" filter="url(#sh2)"/>
  <text x="735" y="275" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">Output Guardrails</text>
  <text x="735" y="293" text-anchor="middle" fill="#94a3b8" font-size="10">• Citation verification (source attribution)</text>
  <text x="735" y="308" text-anchor="middle" fill="#94a3b8" font-size="10">• Hallucination detection scoring</text>
  <text x="735" y="323" text-anchor="middle" fill="#94a3b8" font-size="10">• PII redaction in responses</text>

  <!-- Real-world breaches -->
  <text x="450" y="380" text-anchor="middle" fill="#fca5a5" font-size="16" font-weight="700">Real-World RAG Breach Examples</text>

  <rect x="30" y="395" width="270" height="75" rx="8" fill="#1e1e2e" stroke="#dc2626" stroke-width="1"/>
  <text x="165" y="418" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Samsung ChatGPT Leak (2023)</text>
  <text x="165" y="436" text-anchor="middle" fill="#94a3b8" font-size="9">Engineers fed proprietary source code</text>
  <text x="165" y="450" text-anchor="middle" fill="#94a3b8" font-size="9">into ChatGPT → training data leakage</text>

  <rect x="315" y="395" width="270" height="75" rx="8" fill="#1e1e2e" stroke="#dc2626" stroke-width="1"/>
  <text x="450" y="418" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Chevrolet Chatbot Exploit (2024)</text>
  <text x="450" y="436" text-anchor="middle" fill="#94a3b8" font-size="9">RAG-powered dealership bot tricked</text>
  <text x="450" y="450" text-anchor="middle" fill="#94a3b8" font-size="9">into selling car for $1 via prompt injection</text>

  <rect x="600" y="395" width="270" height="75" rx="8" fill="#1e1e2e" stroke="#dc2626" stroke-width="1"/>
  <text x="735" y="418" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Air Canada Bot Ruling (2024)</text>
  <text x="735" y="436" text-anchor="middle" fill="#94a3b8" font-size="9">RAG chatbot hallucinated refund policy</text>
  <text x="735" y="450" text-anchor="middle" fill="#94a3b8" font-size="9">→ company legally bound to honor it</text>

  <!-- Footer -->
  <text x="450" y="500" text-anchor="middle" fill="#64748b" font-size="11">Sources: OWASP LLM Top 10, NIST AI 600-1, Gartner Hype Cycle AI 2025</text>
  <text x="450" y="518" text-anchor="middle" fill="#475569" font-size="10">securecodereviews.com/shieldx</text>
</svg>