<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bgSupplyHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="cyanLane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="amberLane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="roseLane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <filter id="heroShadow">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-opacity="0.28"/>
    </filter>
    <marker id="heroArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="18" fill="url(#bgSupplyHero)"/>

  <text x="600" y="58" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="700">What Is a Supply Chain Attack?</text>
  <text x="600" y="90" text-anchor="middle" fill="#cbd5e1" font-size="18">How trusted code, updates, and pipelines become attack paths</text>

  <rect x="55" y="140" width="300" height="370" rx="18" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#heroShadow)"/>
  <text x="205" y="180" text-anchor="middle" fill="#67e8f9" font-size="22" font-weight="700">Trusted Inputs</text>
  <rect x="85" y="214" width="240" height="56" rx="10" fill="#082f49" stroke="#38bdf8"/>
  <text x="205" y="238" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="700">Open-source packages</text>
  <text x="205" y="256" text-anchor="middle" fill="#93c5fd" font-size="12">npm, PyPI, containers, SDKs</text>
  <rect x="85" y="288" width="240" height="56" rx="10" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="205" y="312" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="700">CI/CD and build tools</text>
  <text x="205" y="330" text-anchor="middle" fill="#c4b5fd" font-size="12">Actions, runners, release jobs</text>
  <rect x="85" y="362" width="240" height="56" rx="10" fill="#052e16" stroke="#22c55e"/>
  <text x="205" y="386" text-anchor="middle" fill="#dcfce7" font-size="14" font-weight="700">Vendor updates</text>
  <text x="205" y="404" text-anchor="middle" fill="#86efac" font-size="12">Software updates and CDNs</text>
  <rect x="85" y="436" width="240" height="56" rx="10" fill="#3f1d0a" stroke="#f59e0b"/>
  <text x="205" y="460" text-anchor="middle" fill="#fef3c7" font-size="14" font-weight="700">Signing and artifacts</text>
  <text x="205" y="478" text-anchor="middle" fill="#fcd34d" font-size="12">Images, binaries, registries</text>

  <rect x="405" y="140" width="390" height="370" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#heroShadow)"/>
  <text x="600" y="180" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">How the Attack Works</text>
  <rect x="455" y="220" width="290" height="52" rx="10" fill="#082f49" stroke="url(#cyanLane)"/>
  <text x="600" y="242" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="700">1. Compromise a trusted upstream component</text>
  <text x="600" y="260" text-anchor="middle" fill="#93c5fd" font-size="12">Package, maintainer, workflow, update server</text>
  <line x1="600" y1="272" x2="600" y2="302" stroke="#67e8f9" stroke-width="3"/>
  <rect x="455" y="302" width="290" height="52" rx="10" fill="#422006" stroke="url(#amberLane)"/>
  <text x="600" y="324" text-anchor="middle" fill="#fef3c7" font-size="14" font-weight="700">2. Let normal delivery spread the payload</text>
  <text x="600" y="342" text-anchor="middle" fill="#fcd34d" font-size="12">Install, build, update, deploy</text>
  <line x1="600" y1="354" x2="600" y2="384" stroke="#fde68a" stroke-width="3"/>
  <rect x="455" y="384" width="290" height="52" rx="10" fill="#3f0d12" stroke="url(#roseLane)"/>
  <text x="600" y="406" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700">3. Abuse trust downstream</text>
  <text x="600" y="424" text-anchor="middle" fill="#fda4af" font-size="12">Steal secrets, backdoor releases, pivot further</text>
  <text x="600" y="470" text-anchor="middle" fill="#cbd5e1" font-size="15">The attacker wins by entering through a channel your systems already allow.</text>

  <rect x="845" y="140" width="300" height="370" rx="18" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#heroShadow)"/>
  <text x="995" y="180" text-anchor="middle" fill="#fca5a5" font-size="22" font-weight="700">Downstream Impact</text>
  <rect x="875" y="214" width="240" height="50" rx="10" fill="#3f0d12" stroke="#ef4444"/>
  <text x="995" y="236" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700">Secrets exposure</text>
  <text x="995" y="252" text-anchor="middle" fill="#fda4af" font-size="11">Cloud keys, tokens, CI variables</text>
  <rect x="875" y="282" width="240" height="50" rx="10" fill="#172554" stroke="#3b82f6"/>
  <text x="995" y="304" text-anchor="middle" fill="#bfdbfe" font-size="14" font-weight="700">Artifact tampering</text>
  <text x="995" y="320" text-anchor="middle" fill="#93c5fd" font-size="11">Backdoored apps and containers</text>
  <rect x="875" y="350" width="240" height="50" rx="10" fill="#1f2937" stroke="#94a3b8"/>
  <text x="995" y="372" text-anchor="middle" fill="#e5e7eb" font-size="14" font-weight="700">Customer compromise</text>
  <text x="995" y="388" text-anchor="middle" fill="#cbd5e1" font-size="11">Malware, injected scripts, exposure</text>
  <rect x="875" y="418" width="240" height="50" rx="10" fill="#052e16" stroke="#22c55e"/>
  <text x="995" y="440" text-anchor="middle" fill="#dcfce7" font-size="14" font-weight="700">Operational disruption</text>
  <text x="995" y="456" text-anchor="middle" fill="#86efac" font-size="11">Incident response and rebuild effort</text>

  <line x1="355" y1="326" x2="405" y2="326" stroke="#67e8f9" stroke-width="3" marker-end="url(#heroArrow)"/>
  <line x1="795" y1="326" x2="845" y2="326" stroke="#67e8f9" stroke-width="3" marker-end="url(#heroArrow)"/>

  <text x="600" y="585" text-anchor="middle" fill="#64748b" font-size="14">securecodereviews.com  |  Software supply chain security guide</text>
</svg>