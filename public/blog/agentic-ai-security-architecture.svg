<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shArch"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="900" height="520" fill="url(#bgArch)" rx="12"/>
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Agentic AI Security Architecture</text>

  <rect x="20" y="70" width="205" height="155" rx="10" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2" filter="url(#shArch)"/>
  <text x="122" y="95" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">1. Goal + Input Layer</text>
  <text x="35" y="123" fill="#94a3b8" font-size="10">• User goal and task request</text>
  <text x="35" y="140" fill="#94a3b8" font-size="10">• Prompt injection screening</text>
  <text x="35" y="157" fill="#94a3b8" font-size="10">• Authentication and session policy</text>
  <text x="35" y="174" fill="#94a3b8" font-size="10">• Risk tier assignment</text>
  <rect x="35" y="188" width="175" height="24" rx="4" fill="#082f49"/>
  <text x="122" y="204" text-anchor="middle" fill="#bae6fd" font-size="10">Question: should the agent act at all?</text>

  <rect x="245" y="70" width="205" height="155" rx="10" fill="#1e1e2e" stroke="#8b5cf6" stroke-width="2" filter="url(#shArch)"/>
  <text x="347" y="95" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">2. Planning + Memory</text>
  <text x="260" y="123" fill="#94a3b8" font-size="10">• Break goal into steps</text>
  <text x="260" y="140" fill="#94a3b8" font-size="10">• Store working context</text>
  <text x="260" y="157" fill="#94a3b8" font-size="10">• Prevent poisoned persistence</text>
  <text x="260" y="174" fill="#94a3b8" font-size="10">• Detect goal drift</text>
  <rect x="260" y="188" width="175" height="24" rx="4" fill="#2e1065"/>
  <text x="347" y="204" text-anchor="middle" fill="#ddd6fe" font-size="10">Risk: memory turns one bad step into many</text>

  <rect x="470" y="70" width="205" height="155" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="2" filter="url(#shArch)"/>
  <text x="572" y="95" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">3. Retrieval + Tools</text>
  <text x="485" y="123" fill="#94a3b8" font-size="10">• Tenant-scoped retrieval</text>
  <text x="485" y="140" fill="#94a3b8" font-size="10">• Tool allowlists and policy checks</text>
  <text x="485" y="157" fill="#94a3b8" font-size="10">• Short-lived credentials</text>
  <text x="485" y="174" fill="#94a3b8" font-size="10">• Human approval for high-risk actions</text>
  <rect x="485" y="188" width="175" height="24" rx="4" fill="#052e16"/>
  <text x="572" y="204" text-anchor="middle" fill="#bbf7d0" font-size="10">Risk: wrong context plus real-world access</text>

  <rect x="695" y="70" width="185" height="155" rx="10" fill="#1e1e2e" stroke="#f59e0b" stroke-width="2" filter="url(#shArch)"/>
  <text x="787" y="95" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">4. Output + Action</text>
  <text x="710" y="123" fill="#94a3b8" font-size="10">• Validate responses and commands</text>
  <text x="710" y="140" fill="#94a3b8" font-size="10">• Sanitize rendered content</text>
  <text x="710" y="157" fill="#94a3b8" font-size="10">• Gate state changes</text>
  <text x="710" y="174" fill="#94a3b8" font-size="10">• Maintain rollback path</text>
  <rect x="710" y="188" width="155" height="24" rx="4" fill="#422006"/>
  <text x="787" y="204" text-anchor="middle" fill="#fde68a" font-size="10">Treat output like untrusted input</text>

  <text x="450" y="262" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Defense-in-Depth Control Plane</text>

  <rect x="20" y="286" width="860" height="70" rx="10" fill="#111827" stroke="#334155" stroke-width="1" filter="url(#shArch)"/>
  <text x="100" y="314" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">Identity</text>
  <text x="100" y="332" text-anchor="middle" fill="#94a3b8" font-size="9">Scoped agent credentials</text>
  <text x="260" y="314" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">Policy</text>
  <text x="260" y="332" text-anchor="middle" fill="#94a3b8" font-size="9">What the agent may do</text>
  <text x="450" y="314" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">Observability</text>
  <text x="450" y="332" text-anchor="middle" fill="#94a3b8" font-size="9">Goals, context, tools, actions</text>
  <text x="640" y="314" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700">Approvals</text>
  <text x="640" y="332" text-anchor="middle" fill="#94a3b8" font-size="9">Required for high-risk changes</text>
  <text x="810" y="314" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">Kill Switch</text>
  <text x="810" y="332" text-anchor="middle" fill="#94a3b8" font-size="9">Fast rollback and safe fallback</text>

  <rect x="20" y="384" width="420" height="98" rx="10" fill="#1e1e2e" stroke="#dc2626" stroke-width="1.5" filter="url(#shArch)"/>
  <text x="230" y="410" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">Common Failure Modes</text>
  <text x="35" y="435" fill="#94a3b8" font-size="10">• Prompt injection alters goals or tool selection</text>
  <text x="35" y="452" fill="#94a3b8" font-size="10">• Retrieval ignores tenant boundaries</text>
  <text x="35" y="469" fill="#94a3b8" font-size="10">• Agent writes unsafe data into persistent memory</text>

  <rect x="460" y="384" width="420" height="98" rx="10" fill="#1e1e2e" stroke="#22c55e" stroke-width="1.5" filter="url(#shArch)"/>
  <text x="670" y="410" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">Secure Deployment Pattern</text>
  <text x="475" y="435" fill="#94a3b8" font-size="10">• Start with narrow tasks and reversible actions</text>
  <text x="475" y="452" fill="#94a3b8" font-size="10">• Separate recommendation from execution</text>
  <text x="475" y="469" fill="#94a3b8" font-size="10">• Test real workflows, not just model prompts</text>

  <text x="450" y="506" text-anchor="middle" fill="#64748b" font-size="10">securecodereviews.com • Agentic AI security guide</text>
</svg>