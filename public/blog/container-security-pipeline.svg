<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none">
  <defs>
    <linearGradient id="csBg" x1="0" y1="0" x2="900" y2="520">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" rx="12" fill="url(#csBg)"/>
  <text x="450" y="38" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#06b6d4" text-anchor="middle">Container Security — Build → Ship → Run Pipeline</text>
  <!-- BUILD Phase -->
  <rect x="40" y="55" width="265" height="200" rx="8" fill="#3b82f610" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="172" y="78" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#3b82f6" text-anchor="middle">BUILD</text>
  <rect x="55" y="90" width="235" height="32" rx="5" fill="#3b82f615" stroke="#3b82f680" stroke-width="1"/>
  <text x="172" y="111" font-family="system-ui,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">Minimal base images (distroless)</text>
  <rect x="55" y="130" width="235" height="32" rx="5" fill="#3b82f615" stroke="#3b82f680" stroke-width="1"/>
  <text x="172" y="151" font-family="system-ui,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">Multi-stage Dockerfile builds</text>
  <rect x="55" y="170" width="235" height="32" rx="5" fill="#3b82f615" stroke="#3b82f680" stroke-width="1"/>
  <text x="172" y="191" font-family="system-ui,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">Scan with Trivy / Grype in CI</text>
  <rect x="55" y="210" width="235" height="32" rx="5" fill="#3b82f615" stroke="#3b82f680" stroke-width="1"/>
  <text x="172" y="231" font-family="system-ui,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">No secrets in layers</text>
  <!-- Arrow -->
  <text x="320" y="155" font-family="system-ui,sans-serif" font-size="24" fill="#475569">→</text>
  <!-- SHIP Phase -->
  <rect x="340" y="55" width="220" height="200" rx="8" fill="#a855f710" stroke="#a855f7" stroke-width="1.5"/>
  <text x="450" y="78" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#a855f7" text-anchor="middle">SHIP</text>
  <rect x="355" y="90" width="190" height="32" rx="5" fill="#a855f715" stroke="#a855f780" stroke-width="1"/>
  <text x="450" y="111" font-family="system-ui,sans-serif" font-size="11" fill="#c084fc" text-anchor="middle">Sign images (Cosign)</text>
  <rect x="355" y="130" width="190" height="32" rx="5" fill="#a855f715" stroke="#a855f780" stroke-width="1"/>
  <text x="450" y="151" font-family="system-ui,sans-serif" font-size="11" fill="#c084fc" text-anchor="middle">Private registry only</text>
  <rect x="355" y="170" width="190" height="32" rx="5" fill="#a855f715" stroke="#a855f780" stroke-width="1"/>
  <text x="450" y="191" font-family="system-ui,sans-serif" font-size="11" fill="#c084fc" text-anchor="middle">SBOM generation</text>
  <rect x="355" y="210" width="190" height="32" rx="5" fill="#a855f715" stroke="#a855f780" stroke-width="1"/>
  <text x="450" y="231" font-family="system-ui,sans-serif" font-size="11" fill="#c084fc" text-anchor="middle">Verify provenance (SLSA)</text>
  <!-- Arrow -->
  <text x="575" y="155" font-family="system-ui,sans-serif" font-size="24" fill="#475569">→</text>
  <!-- RUN Phase -->
  <rect x="600" y="55" width="265" height="200" rx="8" fill="#10b98110" stroke="#10b981" stroke-width="1.5"/>
  <text x="732" y="78" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">RUN</text>
  <rect x="615" y="90" width="235" height="32" rx="5" fill="#10b98115" stroke="#10b98180" stroke-width="1"/>
  <text x="732" y="111" font-family="system-ui,sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Non-root user (UID != 0)</text>
  <rect x="615" y="130" width="235" height="32" rx="5" fill="#10b98115" stroke="#10b98180" stroke-width="1"/>
  <text x="732" y="151" font-family="system-ui,sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Read-only root filesystem</text>
  <rect x="615" y="170" width="235" height="32" rx="5" fill="#10b98115" stroke="#10b98180" stroke-width="1"/>
  <text x="732" y="191" font-family="system-ui,sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Seccomp + AppArmor profiles</text>
  <rect x="615" y="210" width="235" height="32" rx="5" fill="#10b98115" stroke="#10b98180" stroke-width="1"/>
  <text x="732" y="231" font-family="system-ui,sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Runtime monitoring (Falco)</text>
  <!-- Threat Comparison Table -->
  <text x="60" y="285" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ef4444">CONTAINER ESCAPE TECHNIQUES</text>
  <!-- Header -->
  <rect x="40" y="295" width="280" height="30" rx="0" fill="#334155"/>
  <text x="180" y="315" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Technique</text>
  <rect x="320" y="295" width="200" height="30" rx="0" fill="#334155"/>
  <text x="420" y="315" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Severity</text>
  <rect x="520" y="295" width="345" height="30" rx="0" fill="#334155"/>
  <text x="692" y="315" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Mitigation</text>
  <!-- Row 1 -->
  <rect x="40" y="325" width="280" height="28" fill="#1e293b80"/>
  <text x="180" y="344" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Privileged mode + nsenter</text>
  <rect x="320" y="325" width="200" height="28" fill="#ef444410"/>
  <text x="420" y="344" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#ef4444" text-anchor="middle">CRITICAL</text>
  <rect x="520" y="325" width="345" height="28" fill="#1e293b80"/>
  <text x="692" y="344" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Drop ALL caps, no privileged flag</text>
  <!-- Row 2 -->
  <rect x="40" y="353" width="280" height="28" fill="#1e293b40"/>
  <text x="180" y="372" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">CVE-2024-21626 (runc breakout)</text>
  <rect x="320" y="353" width="200" height="28" fill="#ef444410"/>
  <text x="420" y="372" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#ef4444" text-anchor="middle">CRITICAL</text>
  <rect x="520" y="353" width="345" height="28" fill="#1e293b40"/>
  <text x="692" y="372" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Patch runc &gt;= 1.1.12</text>
  <!-- Row 3 -->
  <rect x="40" y="381" width="280" height="28" fill="#1e293b80"/>
  <text x="180" y="400" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Docker socket mount (/var/run/docker.sock)</text>
  <rect x="320" y="381" width="200" height="28" fill="#f9731610"/>
  <text x="420" y="400" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#f97316" text-anchor="middle">HIGH</text>
  <rect x="520" y="381" width="345" height="28" fill="#1e293b80"/>
  <text x="692" y="400" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Never mount Docker socket in pods</text>
  <!-- Row 4 -->
  <rect x="40" y="409" width="280" height="28" fill="#1e293b40"/>
  <text x="180" y="428" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Kernel exploit (Dirty Pipe / OverlayFS)</text>
  <rect x="320" y="409" width="200" height="28" fill="#f9731610"/>
  <text x="420" y="428" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#f97316" text-anchor="middle">HIGH</text>
  <rect x="520" y="409" width="345" height="28" fill="#1e293b40"/>
  <text x="692" y="428" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Seccomp + kernel patches + gVisor</text>
  <!-- Stats -->
  <rect x="40" y="455" width="200" height="50" rx="8" fill="#06b6d420" stroke="#06b6d4" stroke-width="1"/>
  <text x="140" y="478" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#06b6d4" text-anchor="middle">87%</text>
  <text x="140" y="495" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">of containers have HIGH/CRIT CVEs</text>
  <rect x="260" y="455" width="200" height="50" rx="8" fill="#a855f720" stroke="#a855f7" stroke-width="1"/>
  <text x="360" y="478" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#a855f7" text-anchor="middle">76%</text>
  <text x="360" y="495" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">run as root unnecessarily</text>
  <rect x="480" y="455" width="200" height="50" rx="8" fill="#ef444420" stroke="#ef4444" stroke-width="1"/>
  <text x="580" y="478" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#ef4444" text-anchor="middle">52%</text>
  <text x="580" y="495" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">allow privilege escalation</text>
  <rect x="700" y="455" width="165" height="50" rx="8" fill="#10b98120" stroke="#10b981" stroke-width="1"/>
  <text x="782" y="478" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#10b981" text-anchor="middle">3x</text>
  <text x="782" y="495" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">faster breach with container escape</text>
</svg>